[package]
name = "bento"
version = "0.5.1"
edition = "2024"

[dependencies]
wgpu = "25"
glyphon = "0.9"
bytemuck = { version = "1.14", features = ["derive"] }
winit = "0.30"
pollster = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
taffy = "0.9.2"

bento_derive = { path = "../bento_derive" }
bento_wgpu = { path = "../bento_wgpu" }

[dev-dependencies]
winit = "0.30"
pollster = "0.3"
