<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
    }

    .rotated-text {
      transform: rotate(25deg);
      display: inline-block;
      margin-left: 50px;
    }

    .text-16 {
      font-size: 16px;
      margin-top: 100px;
    }

    .text-12 {
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="rotated-text text-16">
    Enter your name 💁👌🎍😍
  </div>

  <div class="rotated-text text-12">
    Enter your name 💁👌🎍😍
  </div>

</body>
</html>
